name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Create secure config
      run: |
        cat > js/secure-config.js << 'EOF'
        // セキュアな設定ファイル（APIキーは含まない）
        export const SECURE_CONFIG = {
          API_ENDPOINT: 'https://your-site.netlify.app/.netlify/functions/sheets',
          ALLOWED_ORIGINS: [
            'https://yakinorinori.github.io',
            'https://localhost:3000'
          ],
          VERSION: 'v1.0.0',
          ENVIRONMENT: 'production'
        };
        
        // 設定状況を確認する関数
        export function checkSecureConfig() {
          return {
            hasEndpoint: !!SECURE_CONFIG.API_ENDPOINT,
            environment: SECURE_CONFIG.ENVIRONMENT,
            version: SECURE_CONFIG.VERSION
          };
        }
        EOF
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./