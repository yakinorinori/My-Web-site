<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📱 売上報告システム - モバイル版</title>
    <meta name="description" content="スマートフォン向け売上報告システム - 伝票撮影・即時報告">
    
    <!-- モバイル最適化 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    
    <!-- 画面向き制御（縦向き推奨） -->
    <meta name="screen-orientation" content="portrait">
    <meta name="apple-mobile-web-app-orientation" content="portrait">
    
    <!-- PWA対応 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
    
    <!-- CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* タッチ操作の改善 */
        button, input, select {
            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* スクロール改善 */
        body {
            -webkit-overflow-scrolling: touch;
        }
        
        /* 入力フィールドのズーム防止 */
        input[type="number"], input[type="date"] {
            font-size: 16px;
        }
        
        /* カメラボタンのアニメーション */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* ローディングアニメーション */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
    </style>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
</head>
<body>
    <!-- アプリケーションルート -->
    <div id="app-root">
        <!-- 初期ローディング画面 -->
        <div style="
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        ">
            <div>
                <div style="
                    width: 64px;
                    height: 64px;
                    border: 4px solid rgba(255, 255, 255, 0.3);
                    border-top: 4px solid white;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin: 0 auto 20px;
                "></div>
                <h2 style="color: white; margin: 0 0 8px 0; font-size: 24px;">📱</h2>
                <h3 style="color: white; margin: 0 0 8px 0;">売上報告システム</h3>
                <p style="color: rgba(255, 255, 255, 0.8); margin: 0;">モバイル版 起動中...</p>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="js/mobile.js"></script>
    
    <!-- アプリ自動起動 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // モバイルデバイス検出
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                console.log('📱 モバイルデバイス検出 - モバイル版起動');
            } else {
                console.log('🖥️ デスクトップデバイス - モバイル版でも動作');
            }
            
            // 少し遅延してからアプリを起動
            setTimeout(() => {
                initMobileSalesReport();
            }, 1000);
        });
        
        // PWA インストールプロンプト
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // インストールボタンを表示（必要に応じて）
            console.log('📲 PWAインストール可能');
        });
        
        // サービスワーカー登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('🔧 ServiceWorker登録成功');
                    })
                    .catch((error) => {
                        console.log('❌ ServiceWorker登録失敗:', error);
                    });
            });
        }
    </script>
</body>
</html>
